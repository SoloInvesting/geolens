name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  web:
    name: Web and router
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit --pretty false

      - name: Build and test
        run: npm test

  inference:
    name: Inference service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/inference/requirements.txt
            services/inference/requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r services/inference/requirements-dev.txt

      - name: Test inference service
        run: python -m pytest services/inference/tests
